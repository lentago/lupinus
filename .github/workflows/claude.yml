# ============================================================================
# Claude Code — Interactive @claude Responder
# ============================================================================
# Thin wrapper around lentago/shared-workflows/claude-responder.yml, matching
# the callers in the other active repos. Bash is scoped to this repository's
# own two CI checks (the ones docs-check.yml runs).
#
# Scope note: GITHUB_TOKEN cannot create or update files under
# .github/workflows/, so the responder can review, analyse and comment here but
# cannot author CI changes for this repo.
# ============================================================================

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, labeled]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited, labeled, assigned]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: lentago/shared-workflows/.github/workflows/claude-responder.yml@v1.2.3 # v1.2.3
    secrets: inherit
    with:
      allowed_tools: '"Bash(git add:*)" "Bash(git commit:*)" "Bash(git checkout:*)" "Bash(git switch:*)" "Bash(git push:*)" "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git branch:*)" "Bash(gh pr create:*)" "Bash(gh pr merge:*)" "Bash(gh pr view:*)" "Bash(gh issue view:*)" "Bash(python3 ci/check_docs_links.py:*)" "Bash(python3 ci/check_product_list.py:*)" "Read" "Edit" "Write"'
