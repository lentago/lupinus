# ============================================================================
# agent-pr-gate — hold the bullpen's runner App PRs for a human approval
# ============================================================================
# Copied from lentago/shared-workflows at v1.6.0 (commit
# 36d432c2530a5880a464050a6b74ccb217266f1e): this workflow follows that
# release's agent-pr-gate.yml, and ci/agent_pr_gate.py and
# ci/test_agent_pr_gate.py are byte-for-byte copies of the files of the same
# name there. Self-contained: it calls nothing under the lentago org.
# When a shared-workflows release changes the script or the reusable's steps,
# update this copy in a pull request and move this header to the new tag and
# commit.
#
# In this repository: a pull request authored by lentago-claude-runner[bot]
# passes once a person with write access has approved its current head (or,
# under the routine exception, once the cr-automerge record names the head).
# Any other author passes at once, without an API call.
#
# In an adopter's copy of this kit: no pull request is authored by
# lentago-claude-runner[bot], so the check passes every pull request at once
# and reads nothing. It costs one fast green check and changes nothing about
# how your pull requests merge.
#
# The job's `name:` is pinned to "agent-pr-gate / agent-pr-gate" — the
# status-check context the fleet requires. Changing it holds every PR at
# "Expected" once the context is required.
#
# Deliberately NOT path-filtered, and no draft skip: a required check that
# never reports deadlocks the PR.
#
# The script is checked out from the PR's BASE branch (`base.ref`, the base
# branch's current tip), never the PR head, so a pull request cannot edit the
# script that judges it. It is not `base.sha`: that is frozen at the PR's last
# update, so a PR opened before the gate merged would find no script at its
# base commit and fail closed even after a human approved the head. The base
# branch tip is the one commit a PR cannot edit. A PR that adds the script for
# the first time therefore fails this check (the base has no script yet); that
# is expected, and there is deliberately no fallback to the PR's own copy.
# ============================================================================

name: agent-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, auto_merge_enabled]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  agent-pr-gate:
    name: agent-pr-gate / agent-pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # One evaluation per head commit at a time. Events for the same head queue
    # behind the running one, never cancel it: a run waiting for cr-automerge's
    # record must finish, and the last queued run then reads the latest state.
    concurrency:
      group: agent-pr-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    steps:
      - name: Is this PR gated?
        id: who
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AGENT: lentago-claude-runner[bot]
        run: |
          if [[ -z "$NUMBER" ]]; then
            echo "::error::agent-pr-gate runs on pull_request and pull_request_review events; this event carries no pull request"
            exit 1
          fi
          if [[ "${AUTHOR,,}" != "${AGENT,,}" ]]; then
            echo "PR #$NUMBER is authored by $AUTHOR, not $AGENT: nothing to gate."
            echo "gated=false" >> "$GITHUB_OUTPUT"
          else
            echo "gated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout agent-pr-gate script from the base branch
        if: steps.who.outputs.gated == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .agent-pr-gate-tooling
          sparse-checkout: ci
          fetch-depth: 1
          persist-credentials: false

      - name: Check approval or routine record
        if: steps.who.outputs.gated == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AGENT: lentago-claude-runner[bot]
          ACTION: ${{ github.event.action }}
          ARMED: ${{ github.event.pull_request.auto_merge && 'armed' || '' }}
        run: |
          # cr-automerge arms first and posts its record a moment later. Any run
          # on an armed PR (the run arming triggers, or one queued behind it)
          # waits up to two minutes for a record of this head; an approval or a
          # record already in place ends the wait at once.
          WAIT=0
          [[ "$ACTION" == auto_merge_enabled || -n "$ARMED" ]] && WAIT=120
          python3 .agent-pr-gate-tooling/ci/agent_pr_gate.py \
            --repo "$REPO" --pr "$NUMBER" --head-sha "$HEAD_SHA" \
            --author "$AUTHOR" --agent "$AGENT" --wait-for-marker "$WAIT"
